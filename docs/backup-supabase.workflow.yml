name: Back up Supabase

on:
    schedule:
        # Weekly, Sunday 03:00 UTC. With 21 days of artifact retention this
        # keeps about 3 backups.
        - cron: '0 3 * * 0'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: supabase-backup
    cancel-in-progress: false

jobs:
    backup:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Supabase CLI
              uses: supabase/setup-cli@v3
              with:
                  version: 2.116.0

            # GitHub-hosted runners have no IPv6 route and Supabase's direct
            # database host is IPv6-only. Linking first makes the CLI connect
            # through Supabase's IPv4-compatible connection pooler instead.
            - name: Link Supabase project
              env:
                  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
                  PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF_PROD }}
              run: supabase link --project-ref "$PROJECT_REF"

            # Data only: the schema is already in Setu's supabase/migrations/.
            # `auth` is included because public.profiles references auth.users;
            # the session and token tables are excluded because they are large,
            # sensitive, and useless after a restore. Storage (images) is not
            # backed up.
            - name: Dump database
              env:
                  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
              run: |
                  supabase db dump --linked --data-only --use-copy \
                    --schema public,auth \
                    --exclude auth.audit_log_entries,auth.refresh_tokens,auth.sessions,auth.flow_state,auth.one_time_tokens,auth.mfa_amr_claims \
                    --file data.sql

            - name: Verify dump
              run: |
                  # An empty or truncated dump must fail the run instead of
                  # silently replacing good backups.
                  test -s data.sql
                  grep -q '^COPY "public"."profiles"' data.sql
                  grep -q '^COPY "auth"."users"' data.sql

            # Anyone with read access to this repository can download its
            # artifacts, so the dump is encrypted to a public key. The matching
            # private key is kept offline and is never stored on GitHub.
            - name: Compress and encrypt
              env:
                  BACKUP_AGE_PUBLIC_KEY: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
              run: |
                  test -n "$BACKUP_AGE_PUBLIC_KEY"
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq age
                  gzip --best data.sql
                  age --recipient "$BACKUP_AGE_PUBLIC_KEY" \
                    --output "setu-prod-$(date -u +%F).sql.gz.age" data.sql.gz
                  ls -l ./*.age

            - name: Upload encrypted backup
              uses: actions/upload-artifact@v4
              with:
                  name: setu-prod-backup-${{ github.run_number }}
                  path: setu-prod-*.sql.gz.age
                  retention-days: 21
                  if-no-files-found: error
