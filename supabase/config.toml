# Local Supabase configuration. Project-specific values and all secrets belong
# in the Supabase dashboard or local .env files, never in this repository.
project_id = "setu"

[api]
enabled = true
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "https://*.vercel.app"]

[storage]
enabled = true
