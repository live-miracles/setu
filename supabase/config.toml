# Supabase CLI project configuration. Project-specific values and all secrets
# belong in the Supabase dashboard or local environment files, never here.
project_id = "setu"

[functions.email-dispatcher]
verify_jwt = false

[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/restrict_user_by_email_domain"

[api]
enabled = true
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]

[storage]
enabled = true
