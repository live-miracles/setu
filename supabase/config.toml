# Supabase CLI project configuration. Project-specific values and all secrets
# belong in the Supabase dashboard or local environment files, never here.
project_id = "setu"

[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/restrict_user_by_email_domain"

# Called by pg_cron with a shared secret header instead of a user JWT.
[functions.email-dispatcher]
verify_jwt = false

# Only the app's own tables are exposed through the Data API. Storage is used
# through the Storage API (signed upload URLs, public image URLs), which does not
# need the storage schema exposed here. Keep the hosted project's Data API
# "Exposed schemas" setting in step with this list.
[api]
enabled = true
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[storage]
enabled = true
