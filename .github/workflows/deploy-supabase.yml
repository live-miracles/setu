name: Deploy Supabase

on:
    push:
        branches:
            - master
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: supabase-deploy-${{ github.ref }}
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                target: [prod, dev]

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Apply database migrations
              env:
                  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
                  PROJECT_REF: ${{ matrix.target == 'prod' && secrets.SUPABASE_PROJECT_REF_PROD || secrets.SUPABASE_PROJECT_REF_DEV }}
              run: npx supabase db push --project-ref "$PROJECT_REF"

            - name: Deploy API Edge Function
              env:
                  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
                  PROJECT_REF: ${{ matrix.target == 'prod' && secrets.SUPABASE_PROJECT_REF_PROD || secrets.SUPABASE_PROJECT_REF_DEV }}
              run: npx supabase functions deploy api --project-ref "$PROJECT_REF"
