name: Keep Supabase project alive

on:
    schedule:
        # Free-tier Supabase projects pause after 7 days with no API activity.
        # Every 3 days leaves margin even if a run gets skipped.
        - cron: '0 3 */3 * *'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    ping:
        runs-on: ubuntu-latest
        steps:
            - name: Ping Supabase project
              env:
                  SUPABASE_URL: ${{ secrets.SETU_SUPABASE_URL_PROD }}
                  SUPABASE_KEY: ${{ secrets.SETU_SUPABASE_PUBLISHABLE_KEY_PROD }}
              run: |
                  # Publishable keys can't call the bare /rest/v1/ root (that now
                  # requires a secret key), so query a real table instead. RLS
                  # blocks anonymous reads, but the request still reaches
                  # Postgres and counts as activity, which is all we need.
                  curl --fail --silent --show-error \
                    --header "apikey: $SUPABASE_KEY" \
                    "$SUPABASE_URL/rest/v1/inventory_types?select=id&limit=1"
