<!doctype html>
<html lang="en" data-theme="setu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base target="_top" />
    <title><!--#TITLE#--></title>
    <!--#FAVICON#-->
    <!--#HEAD#-->
  </head>
  <body class="min-h-screen font-sans antialiased">
    <div class="toast toast-top toast-center z-50 gap-2 sm:toast-end">
      <div id="saving-badge" class="alert hidden alert-info py-2 pr-4 shadow-lg">
        <span class="loading loading-xs loading-spinner"></span>
        <span>Saving…</span>
      </div>
      <div id="error-toast" class="alert hidden max-w-xs alert-error shadow-lg sm:max-w-sm">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="size-5 shrink-0"
          aria-hidden="true">
          <path d="M12 4 3 20h18L12 4Z" />
          <line x1="12" y1="10" x2="12" y2="13.5" />
          <circle cx="12" cy="16.5" r="0.75" fill="currentColor" stroke="none" />
        </svg>
        <span data-error-text></span>
      </div>
      <div id="success-toast" class="alert hidden max-w-xs alert-success shadow-lg sm:max-w-sm" role="status" aria-live="polite">
        <span aria-hidden="true">✓</span>
        <span data-success-text></span>
      </div>
    </div>

    <header class="app-shell-header navbar sticky top-0 z-40 gap-2 border-b px-3 sm:px-6">
      <button
        type="button"
        id="mobile-menu-toggle"
        class="btn btn-ghost btn-sm md:hidden"
        aria-label="Open navigation"
        aria-controls="mobile-dock"
        aria-expanded="false">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          class="size-5"
          aria-hidden="true">
          <line x1="4" y1="7" x2="20" y2="7" />
          <line x1="4" y1="12" x2="20" y2="12" />
          <line x1="4" y1="17" x2="20" y2="17" />
        </svg>
      </button>
      <div class="app-shell-brand min-w-0 flex-1">
        <button type="button" data-nav-section="home" aria-label="Go to Home" class="flex w-full min-w-0 text-left">
          <span class="setu-brand-monogram" aria-hidden="true">S</span>
          <span class="setu-brand-copy min-w-0">
            <span class="setu-brand-name block truncate"><!--#TITLE#--></span>
            <span class="setu-brand-kicker">Livestream operations</span>
          </span>
        </button>
      </div>

      <nav id="desktop-nav" aria-label="Primary navigation" class="tabs tabs-box tabs-sm hidden sm:flex">
        <button type="button" class="tab gap-1.5" data-nav-section="home" aria-label="Home" title="Home">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="size-4"
            aria-hidden="true">
            <path d="M4 11.5 12 4l8 7.5" />
            <path d="M6 10v9a1 1 0 0 0 1 1h3v-5h4v5h3a1 1 0 0 0 1-1v-9" />
          </svg>
          <span class="nav-label">Home</span>
        </button>
        <button type="button" class="tab gap-1.5" data-nav-section="roster" aria-label="Roster" title="Roster">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="size-4"
            aria-hidden="true">
            <rect x="4" y="5" width="16" height="15" rx="2" />
            <line x1="4" y1="9" x2="20" y2="9" />
            <line x1="8" y1="3" x2="8" y2="7" />
            <line x1="16" y1="3" x2="16" y2="7" />
          </svg>
          <span class="nav-label">Roster</span>
        </button>
        <button type="button" class="tab gap-1.5" data-nav-section="inventory" aria-label="Inventory" title="Inventory">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="size-4"
            aria-hidden="true">
            <path d="M3.5 8 12 4l8.5 4L12 12 3.5 8Z" />
            <path d="M3.5 8v8L12 20l8.5-4V8" />
            <path d="M12 12v8" />
          </svg>
          <span class="nav-label">Inventory</span>
        </button>
        <button type="button" class="tab gap-1.5" data-nav-section="programs" aria-label="Programs" title="Programs">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="size-4"
            aria-hidden="true">
            <path d="M4 9h16v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9Z" />
            <path d="M4 9 5 5h3l-1 4Z" />
            <path d="M9.5 9 10.5 5h3l-1 4Z" />
            <path d="M15 9l1-4h3l-1 4Z" />
          </svg>
          <span class="nav-label">Programs</span>
        </button>
        <button type="button" class="tab gap-1.5" data-nav-section="tickets" aria-label="Tickets" title="Tickets">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="size-4"
            aria-hidden="true">
            <rect x="3" y="6" width="18" height="12" rx="2" />
            <line x1="9" y1="6" x2="9" y2="18" stroke-dasharray="2.2 2.2" />
          </svg>
          <span class="nav-label">Tickets</span>
        </button>
      </nav>

      <div class="app-shell-utilities flex flex-none items-center gap-1">
        <div id="settings-menu" class="dropdown dropdown-end hidden">
          <button type="button" tabindex="0" class="btn btn-ghost btn-sm gap-1.5" aria-label="Settings" title="Settings">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="size-4 shrink-0"
              aria-hidden="true">
              <circle cx="12" cy="12" r="3" />
              <path d="M12 3.5v2M12 18.5v2M20.5 12h-2M5.5 12h-2M17.8 6.2l-1.4 1.4M7.6 16.4l-1.4 1.4M17.8 17.8l-1.4-1.4M7.6 7.6 6.2 6.2" />
            </svg>
            <span class="utility-label max-sm:hidden">Settings</span>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="size-3 shrink-0 opacity-60"
              aria-hidden="true">
              <polyline points="6 9 12 15 18 9" />
            </svg>
          </button>
          <ul tabindex="0" class="menu dropdown-content z-50 mt-3 w-56 rounded-box border border-base-300 bg-base-100 p-2 shadow-lg">
            <li class="menu-title">Settings</li>
            <li><a data-nav-section="users">Users</a></li>
            <li><a data-nav-section="departments">Departments</a></li>
            <li><a data-nav-section="places">Places</a></li>
            <li><a data-nav-section="inventory-types">Inventory types</a></li>
            <li><a data-nav-section="home-settings">Home settings</a></li>
            <li><a data-nav-section="roster-presets">Roster presets</a></li>
          </ul>
        </div>

        <div class="dropdown dropdown-end">
          <button type="button" tabindex="0" class="btn max-w-40 btn-ghost btn-sm gap-1.5" aria-label="User menu" title="User menu">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="size-4 shrink-0"
              aria-hidden="true">
              <circle cx="12" cy="8" r="3.5" />
              <path d="M5 20c0-3.5 3.2-6 7-6s7 2.5 7 6" />
            </svg>
            <span id="nav-user-name" class="utility-label truncate"></span>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="size-3 shrink-0 opacity-60"
              aria-hidden="true">
              <polyline points="6 9 12 15 18 9" />
            </svg>
          </button>
          <ul tabindex="0" class="menu dropdown-content z-50 mt-3 w-56 rounded-box border border-base-300 bg-base-100 p-2 shadow-lg">
            <li class="menu-title">
              <div id="nav-user-email" class="truncate font-normal opacity-60"></div>
            </li>
            <li>
              <a data-nav-section="profile">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="size-4"
                  aria-hidden="true">
                  <circle cx="12" cy="8" r="3.5" />
                  <path d="M5 20c0-3.5 3.2-6 7-6s7 2.5 7 6" />
                </svg>
                Profile
              </a>
            </li>
          </ul>
        </div>
      </div>

      <button
        type="button"
        id="sidebar-toggle"
        class="sidebar-toggle btn btn-circle btn-sm hidden md:flex"
        aria-label="Collapse navigation"
        aria-controls="desktop-nav"
        aria-expanded="true">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="size-4"
          aria-hidden="true">
          <polyline points="14 6 8 12 14 18" />
        </svg>
      </button>
    </header>

    <main id="app-content" class="mx-auto max-w-3xl px-4 pb-24 pt-5 sm:pb-10"></main>

    <div id="mobile-nav-backdrop" class="mobile-nav-backdrop md:hidden"></div>
    <aside id="mobile-dock" class="mobile-nav-drawer md:hidden" aria-label="Primary navigation" aria-hidden="true" inert>
      <div class="mobile-nav-heading">
        <div>
          <div class="setu-brand-name">Setu</div>
          <div class="setu-brand-kicker">Livestream operations</div>
        </div>
        <button type="button" id="mobile-menu-close" class="btn btn-ghost btn-sm" aria-label="Close navigation">✕</button>
      </div>
      <button data-nav-section="home">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="size-5"
          aria-hidden="true">
          <path d="M4 11.5 12 4l8 7.5" />
          <path d="M6 10v9a1 1 0 0 0 1 1h3v-5h4v5h3a1 1 0 0 0 1-1v-9" />
        </svg>
        <span class="nav-label">Home</span>
      </button>
      <button data-nav-section="roster">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="size-5"
          aria-hidden="true">
          <rect x="4" y="5" width="16" height="15" rx="2" />
          <line x1="4" y1="9" x2="20" y2="9" />
          <line x1="8" y1="3" x2="8" y2="7" />
          <line x1="16" y1="3" x2="16" y2="7" />
        </svg>
        <span class="nav-label">Roster</span>
      </button>
      <button data-nav-section="inventory">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="size-5"
          aria-hidden="true">
          <path d="M3.5 8 12 4l8.5 4L12 12 3.5 8Z" />
          <path d="M3.5 8v8L12 20l8.5-4V8" />
          <path d="M12 12v8" />
        </svg>
        <span class="nav-label">Inventory</span>
      </button>
      <button data-nav-section="programs">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="size-5"
          aria-hidden="true">
          <path d="M4 9h16v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9Z" />
          <path d="M4 9 5 5h3l-1 4Z" />
          <path d="M9.5 9 10.5 5h3l-1 4Z" />
          <path d="M15 9l1-4h3l-1 4Z" />
        </svg>
        <span class="nav-label">Programs</span>
      </button>
      <button data-nav-section="tickets">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="size-5"
          aria-hidden="true">
          <rect x="3" y="6" width="18" height="12" rx="2" />
          <line x1="9" y1="6" x2="9" y2="18" stroke-dasharray="2.2 2.2" />
        </svg>
        <span class="nav-label">Tickets</span>
      </button>
    </aside>

    <!--#BODY#-->
  </body>
</html>
