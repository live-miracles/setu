<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e8590c" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Apply the saved theme (dark by default) before first paint so there is no
      // flash of the wrong one. Keep the key, default and colours in step with
      // frontend/src/ui/theme.ts.
      (function () {
        var theme = 'dark';
        try {
          if (localStorage.getItem('setu-theme') === 'light') theme = 'light';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#121110' : '#e8590c');
      })();
    </script>
    <link rel="apple-touch-icon" href="/icons/icon-ios.png" />
    <base target="_top" />
    <title><!--#TITLE#--></title>
    <!--#FAVICON#-->
    <!--#HEAD#-->
  </head>
  <body>
    <div id="app-shell"></div>
    <!--#BODY#-->
  </body>
</html>
