<!doctype html>
<html lang="en" data-theme="setu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base target="_top" />
    <title><!--#TITLE#--></title>
    <!--#FAVICON#-->
    <!--#HEAD#-->
  </head>
  <body class="min-h-screen font-sans antialiased">
    <div class="toast toast-top toast-center z-50 gap-2 sm:toast-end">
      <div id="saving-badge" class="alert hidden alert-info py-2 pr-4 shadow-lg">
        <span class="loading loading-xs loading-spinner"></span>
        <span>Saving…</span>
      </div>
      <div id="error-toast" class="alert hidden max-w-xs alert-error shadow-lg sm:max-w-sm">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="size-5 shrink-0"
          aria-hidden="true">
          <path d="M12 4 3 20h18L12 4Z" />
          <line x1="12" y1="10" x2="12" y2="13.5" />
          <circle cx="12" cy="16.5" r="0.75" fill="currentColor" stroke="none" />
        </svg>
        <span data-error-text></span>
      </div>
    </div>

    <header class="navbar sticky top-0 z-40 bg-base-100 px-3 shadow-sm sm:px-6">
      <div class="navbar-start min-w-0">
        <button type="button" data-nav-section="home" class="btn btn-ghost min-w-0 gap-2.5 px-2 text-xl font-serif font-normal normal-case">
          <span class="relative flex size-2.5 shrink-0" aria-hidden="true">
            <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-success opacity-75 motion-reduce:animate-none"></span>
            <span class="relative inline-flex size-2.5 rounded-full bg-success"></span>
          </span>
          <span class="truncate"><!--#TITLE#--></span>
        </button>
      </div>

      <div id="desktop-nav" class="navbar-center hidden items-center gap-1 md:flex">
        <button type="button" data-nav-section="home" class="btn btn-ghost btn-sm gap-1.5">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="size-4"
            aria-hidden="true">
            <path d="M4 11.5 12 4l8 7.5" />
            <path d="M6 10v9a1 1 0 0 0 1 1h3v-5h4v5h3a1 1 0 0 0 1-1v-9" />
          </svg>
          Home
        </button>
        <button type="button" data-nav-section="programs" class="btn btn-ghost btn-sm gap-1.5">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="size-4"
            aria-hidden="true">
            <path d="M4 9h16v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9Z" />
            <path d="M4 9 5 5h3l-1 4Z" />
            <path d="M9.5 9 10.5 5h3l-1 4Z" />
            <path d="M15 9l1-4h3l-1 4Z" />
          </svg>
          Programs
        </button>
        <button type="button" data-nav-section="inventory" class="btn btn-ghost btn-sm gap-1.5">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="size-4"
            aria-hidden="true">
            <path d="M3.5 8 12 4l8.5 4L12 12 3.5 8Z" />
            <path d="M3.5 8v8L12 20l8.5-4V8" />
            <path d="M12 12v8" />
          </svg>
          Inventory
        </button>
        <button type="button" data-nav-section="tickets" class="btn btn-ghost btn-sm gap-1.5">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="size-4"
            aria-hidden="true">
            <rect x="3" y="6" width="18" height="12" rx="2" />
            <line x1="9" y1="6" x2="9" y2="18" stroke-dasharray="2.2 2.2" />
          </svg>
          Tickets
        </button>
        <div data-settings-menu class="dropdown dropdown-end hidden">
          <button type="button" tabindex="0" class="btn btn-ghost btn-sm gap-1.5">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="size-4"
              aria-hidden="true">
              <circle cx="12" cy="12" r="3" />
              <path d="M12 3.5v2M12 18.5v2M20.5 12h-2M5.5 12h-2M17.8 6.2l-1.4 1.4M7.6 16.4l-1.4 1.4M17.8 17.8l-1.4-1.4M7.6 7.6 6.2 6.2" />
            </svg>
            Settings
          </button>
          <ul tabindex="0" class="menu dropdown-content z-50 mt-3 w-56 rounded-box bg-base-100 p-2 shadow-lg">
            <li><a data-nav-section="roster">Roster</a></li>
            <li><a data-nav-section="users">Users</a></li>
            <li><a data-nav-section="departments">Departments</a></li>
            <li><a data-nav-section="places">Places</a></li>
            <li><a data-nav-section="inventory-types">Inventory types</a></li>
            <li><a data-nav-section="home-content">Others</a></li>
          </ul>
        </div>
      </div>

      <div class="navbar-end gap-1">
        <div data-settings-menu class="dropdown dropdown-end hidden md:hidden">
          <button type="button" tabindex="0" class="btn btn-ghost btn-sm" aria-label="Settings" title="Settings">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="size-4"
              aria-hidden="true">
              <circle cx="12" cy="12" r="3" />
              <path d="M12 3.5v2M12 18.5v2M20.5 12h-2M5.5 12h-2M17.8 6.2l-1.4 1.4M7.6 16.4l-1.4 1.4M17.8 17.8l-1.4-1.4M7.6 7.6 6.2 6.2" />
            </svg>
          </button>
          <ul tabindex="0" class="menu dropdown-content z-50 mt-3 w-56 rounded-box bg-base-100 p-2 shadow-lg">
            <li><a data-nav-section="roster">Roster</a></li>
            <li><a data-nav-section="users">Users</a></li>
            <li><a data-nav-section="departments">Departments</a></li>
            <li><a data-nav-section="places">Places</a></li>
            <li><a data-nav-section="inventory-types">Inventory types</a></li>
            <li><a data-nav-section="home-content">Others</a></li>
          </ul>
        </div>
        <button type="button" data-nav-section="profile" class="btn btn-ghost btn-sm max-w-44 gap-1.5" aria-label="Open profile" title="Open profile">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="size-4 shrink-0"
            aria-hidden="true">
            <circle cx="12" cy="8" r="3.5" />
            <path d="M5 20c0-3.5 3.2-6 7-6s7 2.5 7 6" />
          </svg>
          <span id="nav-user-name" class="truncate max-sm:hidden"></span>
        </button>
      </div>
    </header>

    <main id="app-content" class="mx-auto max-w-[50rem] px-4 pb-24 pt-5 sm:px-6 sm:pb-10"></main>

    <nav
      id="mobile-dock"
      class="fixed inset-x-0 bottom-0 z-40 grid grid-cols-4 gap-1 border-t border-base-300 bg-base-100 px-2 py-2 shadow-lg md:hidden"
      aria-label="Primary navigation">
      <button type="button" data-nav-section="home" class="btn btn-ghost btn-sm h-14 flex-col gap-1 px-1">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="size-4"
          aria-hidden="true">
          <path d="M4 11.5 12 4l8 7.5" />
          <path d="M6 10v9a1 1 0 0 0 1 1h3v-5h4v5h3a1 1 0 0 0 1-1v-9" />
        </svg>
        <span class="text-xs leading-none">Home</span>
      </button>
      <button type="button" data-nav-section="programs" class="btn btn-ghost btn-sm h-14 flex-col gap-1 px-1">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="size-4"
          aria-hidden="true">
          <path d="M4 9h16v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9Z" />
          <path d="M4 9 5 5h3l-1 4Z" />
          <path d="M9.5 9 10.5 5h3l-1 4Z" />
          <path d="M15 9l1-4h3l-1 4Z" />
        </svg>
        <span class="text-xs leading-none">Programs</span>
      </button>
      <button type="button" data-nav-section="inventory" class="btn btn-ghost btn-sm h-14 flex-col gap-1 px-1">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="size-4"
          aria-hidden="true">
          <path d="M3.5 8 12 4l8.5 4L12 12 3.5 8Z" />
          <path d="M3.5 8v8L12 20l8.5-4V8" />
          <path d="M12 12v8" />
        </svg>
        <span class="text-xs leading-none">Inventory</span>
      </button>
      <button type="button" data-nav-section="tickets" class="btn btn-ghost btn-sm h-14 flex-col gap-1 px-1">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="size-4"
          aria-hidden="true">
          <rect x="3" y="6" width="18" height="12" rx="2" />
          <line x1="9" y1="6" x2="9" y2="18" stroke-dasharray="2.2 2.2" />
        </svg>
        <span class="text-xs leading-none">Tickets</span>
      </button>
    </nav>

    <!--#BODY#-->
  </body>
</html>
