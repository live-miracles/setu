<!doctype html>
<html lang="en" data-theme="dim">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Livestream Operations (dev)</title>
    <link rel="stylesheet" href="output.css" />
  </head>
  <body class="min-h-screen bg-base-200 font-sans antialiased">
    <div class="toast toast-top toast-center z-50 gap-2 sm:toast-end">
      <div id="saving-badge" class="alert hidden alert-info py-2 pr-4 shadow-lg">
        <span class="loading loading-xs loading-spinner"></span>
        <span>Saving…</span>
      </div>
      <div id="error-toast" class="alert hidden max-w-xs alert-error shadow-lg sm:max-w-sm">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="size-5 shrink-0"
          aria-hidden="true">
          <path d="M12 4 3 20h18L12 4Z" />
          <line x1="12" y1="10" x2="12" y2="13.5" />
          <circle cx="12" cy="16.5" r="0.75" fill="currentColor" stroke="none" />
        </svg>
        <span data-error-text></span>
      </div>
    </div>

    <header class="navbar sticky top-0 z-40 gap-2 border-b border-base-300 bg-base-100/95 px-3 backdrop-blur sm:px-6">
      <div class="min-w-0 flex-1">
        <button type="button" data-nav-section="home" class="flex w-full min-w-0 items-center gap-2.5">
          <span class="relative flex size-2.5">
            <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-primary opacity-75 motion-reduce:animate-none"></span>
            <span class="relative inline-flex size-2.5 rounded-full bg-primary"></span>
          </span>
          <span class="min-w-0 truncate text-base font-bold tracking-tight text-base-content">Livestream Operations (dev)</span>
        </button>
      </div>

      <div class="join hidden sm:flex">
        <button class="btn join-item btn-sm" data-nav-section="home">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="size-4"
            aria-hidden="true">
            <path d="M4 11.5 12 4l8 7.5" />
            <path d="M6 10v9a1 1 0 0 0 1 1h3v-5h4v5h3a1 1 0 0 0 1-1v-9" />
          </svg>
          Home
        </button>
        <button class="btn join-item btn-sm" data-nav-section="roster">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="size-4"
            aria-hidden="true">
            <rect x="4" y="5" width="16" height="15" rx="2" />
            <line x1="4" y1="9" x2="20" y2="9" />
            <line x1="8" y1="3" x2="8" y2="7" />
            <line x1="16" y1="3" x2="16" y2="7" />
          </svg>
          Roster
        </button>
        <button class="btn join-item btn-sm" data-nav-section="inventory">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="size-4"
            aria-hidden="true">
            <path d="M3.5 8 12 4l8.5 4L12 12 3.5 8Z" />
            <path d="M3.5 8v8L12 20l8.5-4V8" />
            <path d="M12 12v8" />
          </svg>
          Inventory
        </button>
        <button class="btn join-item btn-sm" data-nav-section="tickets">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="size-4"
            aria-hidden="true">
            <rect x="3" y="6" width="18" height="12" rx="2" />
            <line x1="9" y1="6" x2="9" y2="18" stroke-dasharray="2.2 2.2" />
          </svg>
          Tickets
        </button>
      </div>

      <div class="flex flex-none items-center gap-1">
        <div class="dropdown dropdown-end">
          <div tabindex="0" role="button" class="btn indicator btn-circle btn-ghost" aria-label="Notifications">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="size-5"
              aria-hidden="true">
              <path d="M6 9a6 6 0 0 1 12 0v4l1.5 3h-15L6 13V9Z" />
              <path d="M10 19a2 2 0 0 0 4 0" />
            </svg>
            <span id="notification-count" class="badge hidden indicator-item badge-primary badge-sm"></span>
          </div>
          <div tabindex="0" class="dropdown-content z-50 mt-3 w-80 rounded-box border border-base-300 bg-base-100 p-2 shadow-lg">
            <div class="flex items-center justify-between px-2 py-1">
              <span class="text-sm font-semibold">Notifications</span>
              <button id="mark-all-notifications-read" type="button" class="btn btn-ghost btn-xs hidden">Mark all read</button>
            </div>
            <div id="notification-panel" class="max-h-80 space-y-1 overflow-y-auto"></div>
          </div>
        </div>

        <div class="dropdown dropdown-end">
          <button type="button" tabindex="0" class="btn max-w-40 btn-ghost btn-sm gap-1.5">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="size-4 shrink-0"
              aria-hidden="true">
              <circle cx="12" cy="8" r="3.5" />
              <path d="M5 20c0-3.5 3.2-6 7-6s7 2.5 7 6" />
            </svg>
            <span id="nav-user-name" class="truncate"></span>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="size-3 shrink-0 opacity-60"
              aria-hidden="true">
              <polyline points="6 9 12 15 18 9" />
            </svg>
          </button>
          <ul tabindex="0" class="menu dropdown-content z-50 mt-3 w-56 rounded-box border border-base-300 bg-base-100 p-2 shadow-lg">
            <li class="menu-title">
              <div id="nav-user-email" class="truncate font-normal opacity-60"></div>
            </li>
            <li>
              <a data-nav-section="profile">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="size-4"
                  aria-hidden="true">
                  <circle cx="12" cy="8" r="3.5" />
                  <path d="M5 20c0-3.5 3.2-6 7-6s7 2.5 7 6" />
                </svg>
                Profile
              </a>
            </li>
            <li>
              <a data-nav-section="admin" class="hidden">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="size-4"
                  aria-hidden="true">
                  <path d="M12 3.5 5 6v5.5c0 5 3 8 7 9 4-1 7-4 7-9V6l-7-2.5Z" />
                  <path d="M9 12l2 2 4-4" />
                </svg>
                Admin
              </a>
            </li>
          </ul>
        </div>
      </div>
    </header>

    <main id="app-content" class="mx-auto max-w-3xl px-4 pb-24 pt-5 sm:pb-10"></main>

    <div class="dock sm:hidden" aria-label="Primary navigation">
      <button data-nav-section="home">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="size-5"
          aria-hidden="true">
          <path d="M4 11.5 12 4l8 7.5" />
          <path d="M6 10v9a1 1 0 0 0 1 1h3v-5h4v5h3a1 1 0 0 0 1-1v-9" />
        </svg>
        <span class="dock-label">Home</span>
      </button>
      <button data-nav-section="roster">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="size-5"
          aria-hidden="true">
          <rect x="4" y="5" width="16" height="15" rx="2" />
          <line x1="4" y1="9" x2="20" y2="9" />
          <line x1="8" y1="3" x2="8" y2="7" />
          <line x1="16" y1="3" x2="16" y2="7" />
        </svg>
        <span class="dock-label">Roster</span>
      </button>
      <button data-nav-section="inventory">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="size-5"
          aria-hidden="true">
          <path d="M3.5 8 12 4l8.5 4L12 12 3.5 8Z" />
          <path d="M3.5 8v8L12 20l8.5-4V8" />
          <path d="M12 12v8" />
        </svg>
        <span class="dock-label">Inventory</span>
      </button>
      <button data-nav-section="tickets">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="size-5"
          aria-hidden="true">
          <rect x="3" y="6" width="18" height="12" rx="2" />
          <line x1="9" y1="6" x2="9" y2="18" stroke-dasharray="2.2 2.2" />
        </svg>
        <span class="dock-label">Tickets</span>
      </button>
    </div>

    <script src="ts/00-config.js"></script>
    <script src="ts/01-mock-backend.js"></script>
    <script src="ts/02-api.js"></script>
    <script src="ts/03-state.js"></script>
    <script src="ts/04-render-shared.js"></script>
    <script src="ts/11-workflows.js"></script>
    <script src="ts/05-render-home.js"></script>
    <script src="ts/06-render-roster.js"></script>
    <script src="ts/07-render-inventory.js"></script>
    <script src="ts/08-render-tickets.js"></script>
    <script src="ts/09-render-profile.js"></script>
    <script src="ts/10-render-admin.js"></script>
    <script src="ts/12-main.js"></script>
  </body>
</html>
